<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hey! Asmit here</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --pixel: 4px;
      --pixel-gap: 1px;
      --letter-gap: 3px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 56px 40px 40px;
      background: #000;
      color: #fff;
      font-family: "Google Sans Flex", sans-serif;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 28px;
      width: fit-content;
      max-width: 100%;
    }

    .pfp {
      width: 180px;
      height: 180px;
      flex: 0 0 180px;
      border-radius: 50%;
      overflow: hidden;
    }

    .pfp img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .identity {
      min-width: 0;
    }

    .pixel-name {
      display: flex;
      align-items: flex-start;
      flex-wrap: nowrap;
      white-space: nowrap;
      width: max-content;
    }

    .letter {
      display: grid;
      grid-template-columns: repeat(5, var(--pixel));
      grid-template-rows: repeat(7, var(--pixel));
      gap: var(--pixel-gap);
      width: calc(var(--pixel) * 5 + var(--pixel-gap) * 4);
      height: calc(var(--pixel) * 7 + var(--pixel-gap) * 6);
      flex: 0 0 auto;
      margin-right: var(--letter-gap);
    }

    .pixel {
      width: var(--pixel);
      height: var(--pixel);
      background: #fff;
      outline: 0.5px solid #000;
    }

    .subtitle {
      margin-top: 10px;
      color: #777;
      font-size: 17px;
      font-style: normal;
      white-space: nowrap;
    }

    .mail {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid #1a1a1a;
      color: #555;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-style: normal;
      text-align: center;
      white-space: nowrap;
    }

    .mail a {
      color: #fff;
      font-size: 17px;
      text-transform: none;
      letter-spacing: normal;
      margin-left: 8px;
      text-decoration: none;
    }

    @media (max-width: 900px) {
      body {
        padding: 32px 40px 32px 28px;
      }

      :root {
        --pixel: 3px;
        --letter-gap: 2px;
      }

      .profile {
        gap: 20px;
      }

      .pfp {
        width: 140px;
        height: 140px;
        flex-basis: 140px;
      }

      .subtitle {
        font-size: 16px;
      }

      .mail {
        margin-top: 36px;
        font-size: 13px;
      }

      .mail a {
        font-size: 16px;
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 28px 24px;
      }

      :root {
        --pixel: 2.5px;
        --letter-gap: 1px;
      }

      .profile {
        gap: 14px;
      }

      .pfp {
        width: 100px;
        height: 100px;
        flex-basis: 100px;
      }

      .subtitle {
        margin-top: 8px;
        font-size: 14px;
      }

      .mail {
        margin-top: 30px;
        padding-top: 13px;
        font-size: 12px;
        letter-spacing: 0.06em;
        white-space: normal;
        line-height: 1.6;
      }

      .mail a {
        display: inline;
        margin-left: 5px;
        font-size: 15px;
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 24px 18px;
      }

      :root {
        --pixel: 2px;
        --pixel-gap: 0.5px;
        --letter-gap: 1px;
      }

      .profile {
        gap: 11px;
      }

      .pfp {
        width: 78px;
        height: 78px;
        flex-basis: 78px;
      }

      .subtitle {
        margin-top: 7px;
        font-size: 13px;
        white-space: normal;
        line-height: 1.35;
      }

      .mail {
        margin-top: 26px;
        padding-top: 12px;
        font-size: 11px;
      }

      .mail a {
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      :root {
        --pixel: 1.7px;
        --pixel-gap: 0.4px;
        --letter-gap: 0.7px;
      }

      .profile {
        gap: 9px;
      }

      .pfp {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
      }

      .subtitle {
        font-size: 12px;
      }

      .mail {
        font-size: 10px;
      }

      .mail a {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="profile">

      <div class="pfp">
        <img
          src="https://raw.githubusercontent.com/asmitps/asmitps.github.io/main/o41ZAp2EaREeqAZlDsAItrYFIfCBdF1JBD9CQE~tplv-sdweummd6v-text-logo-v4241_QGF2YWNhc2V5MzMz_q75.jpeg"
          alt="Asmit Pranshu Singh"
        >
      </div>

      <div class="identity">
        <div class="pixel-name" id="pixelName"></div>
        <div class="subtitle" id="randomLine"></div>
      </div>

    </div>

    <div class="mail">
      Drop me a hi! -
      <a href="mailto:asmitx01@gmail.com">asmitx01@gmail.com</a>
    </div>

  </div>

  <script>
    const lines = [
      "somewhere, somebody is having the exact opposite day.",
      "nothing to report.",
      "please do not feed the algorithm.",
      "the microwave clock is still wrong.",
      "it seemed important at the time.",
      "there are easier ways to be alive, probably.",
      "this is between us.",
      "no one knows what they're doing",
      "we regret to inform you that time is passing.",
      "a pigeon somewhere is walking with purpose.",
      "the universe has not replied.",
      "anyway, here's a small sentence.",
      "you can stop reading now.",
      "there is no hidden meaning. Or is there. No, there isn't.",
      "somebody has definitely thought about this before.",
      "things could be worse. They could also be better.",
      "this part was left in by mistake.",
      "nothing strange happened here.",
      "remember to look up sometimes.",
      "I have no further comment.",
      "one of these days.",
      "have you tried refreshing the page?",
      "maybe tomorrow will make more sense.",
      "you wanna chat?"
    ];

    document.getElementById("randomLine").textContent =
      lines[Math.floor(Math.random() * lines.length)];

    const glyphs = {
      A: ["01110","10001","10001","11111","10001","10001","10001"],
      B: ["11110","10001","10001","11110","10001","10001","11110"],
      C: ["01111","10000","10000","10000","10000","10000","01111"],
      D: ["11110","10001","10001","10001","10001","10001","11110"],
      E: ["11111","10000","10000","11110","10000","10000","11111"],
      F: ["11111","10000","10000","11110","10000","10000","10000"],
      G: ["01111","10000","10000","10111","10001","10001","01111"],
      H: ["10001","10001","10001","11111","10001","10001","10001"],
      I: ["11111","00100","00100","00100","00100","00100","11111"],
      J: ["00111","00010","00010","00010","10010","10010","01100"],
      K: ["10001","10010","10100","11000","10100","10010","10001"],
      L: ["10000","10000","10000","10000","10000","10000","11111"],
      M: ["10001","11011","10101","10101","10001","10001","10001"],
      N: ["10001","11001","10101","10011","10001","10001","10001"],
      O: ["01110","10001","10001","10001","10001","10001","01110"],
      P: ["11110","10001","10001","11110","10000","10000","10000"],
      Q: ["01110","10001","10001","10001","10101","10010","01101"],
      R: ["11110","10001","10001","11110","10100","10010","10001"],
      S: ["01111","10000","10000","01110","00001","00001","11110"],
      T: ["11111","00100","00100","00100","00100","00100","00100"],
      U: ["10001","10001","10001","10001","10001","10001","01110"],
      V: ["10001","10001","10001","10001","10001","01010","00100"],
      W: ["10001","10001","10001","10101","10101","11011","10001"],
      X: ["10001","10001","01010","00100","01010","10001","10001"],
      Y: ["10001","10001","01010","00100","00100","00100","00100"],
      Z: ["11111","00001","00010","00100","01000","10000","11111"]
    };

    function createLetter(char) {
      const letter = document.createElement("div");
      letter.className = "letter";

      glyphs[char].forEach(row => {
        [...row].forEach(cell => {
          const pixel = document.createElement("div");

          if (cell === "1") {
            pixel.className = "pixel";
          }

          letter.appendChild(pixel);
        });
      });

      return letter;
    }

    function createSpace() {
      const space = document.createElement("div");
      space.className = "letter";
      return space;
    }

    function renderName(name) {
      const container = document.getElementById("pixelName");

      [...name.toUpperCase()].forEach(char => {
        if (char === " ") {
          container.appendChild(createSpace());
        } else if (glyphs[char]) {
          container.appendChild(createLetter(char));
        }
      });
    }

    renderName("Asmit Pranshu Singh");
  </script>

</body>
